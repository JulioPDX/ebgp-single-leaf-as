aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-spine1_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.5/31
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet2
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-spine2_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.255.255.7/31
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet2
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet3
  description: SERVER_dc1-host2_eth1
  shutdown: false
  spanning_tree_portfast: edge
  metadata:
    peer: dc1-host2
    peer_interface: eth1
    peer_type: server
    peer_key: servers
    port_profile: PP-VLAN10
  switchport:
    enabled: true
    mode: access
    access_vlan: 10
hostname: dc1-leaf1b
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$4b6b0b380114b2ff$IX3y6SHDcMoaW3RDOzrtn1zxPKu1VNO1FCnLMXCPKL4JbiZ48NANWmnGGVlc6EUF/wLhI8qS5k3wQ9nD1WfZR.
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.4/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.255.1.4/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.0.2.22/24
  type: oob
  gateway: 192.0.2.1
metadata:
  is_deployed: true
  platform: cEOS
  fabric_name: FABRIC
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/27 eq 32
  - sequence: 20
    action: permit 10.255.1.0/27 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.255.0.4
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
    allowas_in:
      enabled: true
      times: 1
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
    allowas_in:
      enabled: true
      times: 1
  neighbors:
  - ip_address: 10.255.255.4
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet2
  - ip_address: 10.255.255.6
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet2
  - ip_address: 10.255.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.255.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 10
    metadata:
      tenants:
      - S1_FABRIC
    rd: 10.255.0.4:10010
    route_targets:
      both:
      - 10010:10010
    redistribute_routes:
    - learned
  - id: 20
    metadata:
      tenants:
      - S1_FABRIC
    rd: 10.255.0.4:10020
    route_targets:
      both:
      - 10020:10020
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: OVERLAY
    rd: 10.255.0.4:10
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '10:10'
      export:
      - address_family: evpn
        route_targets:
        - '10:10'
    router_id: 10.255.0.4
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.0.2.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan10
  description: Ten
  shutdown: false
  vrf: OVERLAY
  ip_address_virtual: 10.10.10.1/24
  metadata:
    tenants:
    - S1_FABRIC
- name: Vlan20
  description: Twenty
  shutdown: false
  vrf: OVERLAY
  ip_address_virtual: 10.20.20.1/24
  metadata:
    tenants:
    - S1_FABRIC
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 10
  name: Ten
  metadata:
    tenants:
    - S1_FABRIC
- id: 20
  name: Twenty
  metadata:
    tenants:
    - S1_FABRIC
vrfs:
- name: MGMT
  ip_routing: false
- name: OVERLAY
  ip_routing: true
  metadata:
    tenants:
    - S1_FABRIC
vxlan_interface:
  vxlan1:
    description: dc1-leaf1b_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 10
        vni: 10010
      - id: 20
        vni: 10020
      vrfs:
      - name: OVERLAY
        vni: 10
